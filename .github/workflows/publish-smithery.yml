name: Publish to Smithery (Manual)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (leave empty to use package.json)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (build MCPB bundle only, do not publish)"
        type: boolean
        required: false
        default: false

jobs:
  publish-smithery:
    name: Publish to Smithery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 make g++ gcc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 from source
        run: |
          cd node_modules/.pnpm/better-sqlite3@12.10.0/node_modules/better-sqlite3
          npx node-gyp rebuild

      - name: Build MCP server and generate fresh tool manifest
        run: |
          pnpm --filter kxta-core build
          pnpm --filter kontexta-mcp build
          pnpm --filter kontexta-mcp gen:manifest

      - name: Publish to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY || secrets.SMITHERY_TOKEN }}
        run: |
          chmod +x ./scripts/publish-kontexta-smithery.sh
          ARGS=()
          if [ -n "${{ inputs.version }}" ]; then
            ARGS+=("${{ inputs.version }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          ./scripts/publish-kontexta-smithery.sh "${ARGS[@]}"
