name: bootstrap

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    paths:
      - 'bootstrap'
      - 'bootstrap.ps1'
      - '.github/workflows/bootstrap.yml'
      - 'package.json'
      - '.nvmrc'
  push:
    branches: [main]

jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install shellcheck (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y shellcheck
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck bootstrap
      - run: ./bootstrap
      - run: ./bootstrap  # idempotency
      - run: pnpm build
      - run: pnpm test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: ./bootstrap.ps1
        shell: pwsh
      - run: ./bootstrap.ps1
        shell: pwsh
      # TEMP DIAGNOSTIC (remove before merge): identify what scans the
      # protected 'Application Data' junction during next build on Windows.
      - name: Write scandir tracer
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/trace-scandir.cjs" <<'EOF'
          const fs = require('fs');
          let hits = 0;
          function logHit(api, p) {
            if (hits++ > 4) return;
            console.error(`\n[TRACE-SCANDIR] ${api}(${p}) called from:\n` + new Error().stack + '\n');
          }
          for (const api of ['readdir', 'readdirSync', 'opendir', 'opendirSync', 'lstat', 'lstatSync', 'stat', 'statSync']) {
            const orig = fs[api];
            if (!orig) continue;
            fs[api] = function (p, ...rest) {
              try { if (typeof p === 'string' && p.includes('Application Data')) logHit(api, p); } catch {}
              return orig.call(this, p, ...rest);
            };
          }
          EOF
          echo "tracer at $RUNNER_TEMP/trace-scandir.cjs"
      - name: pnpm build (traced)
        shell: bash
        env:
          NODE_OPTIONS: --require ${{ runner.temp }}\trace-scandir.cjs
        run: pnpm build
      - run: pnpm test
