name: Test PR

env:
  CI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install build tools
        run: |
          if ! command -v make >/dev/null 2>&1 || ! command -v g++ >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 make g++ gcc
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rebuild better-sqlite3 from source
        run: |
          cd node_modules/.pnpm/better-sqlite3@12.10.0/node_modules/better-sqlite3
          npx node-gyp rebuild

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test
