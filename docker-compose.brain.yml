# docker-compose.brain.yml
#
# Runs kontexta-brain-host: one server that hosts many fully separate brains. For each brain it is the durable copy
# of that user's context and the sync engine between their machines. A plain, stateless short-polling HTTP service
# with one SQLite file and one published port; nothing is ever pruned.
#
# Build and run:
#
#   docker compose -f docker-compose.brain.yml up -d --build
#
# Then create a brain from a machine (or join one with its share id):
#
#   kontexta brain connect http://127.0.0.1:23010 --create --enroll-secret "$KXTA_BRAIN_ENROLL_SECRET"
#
# Data (every brain's history and machines) persists in the named volume `kontexta-brain-data`.
#
# Environment variables (override as needed):
#   HOST_PORT    Host port for the brain host (default: 23010).
#   HOST_BIND    Host interface to publish on (default: 127.0.0.1, loopback only).
#   KXTA_BRAIN_ENROLL_SECRET  Secret needed to CREATE a brain. Joining an existing one needs only its share id.
#   KXTA_BRAIN_PEPPER         HMAC pepper bound into token and share id hashes. Required for any real deployment:
#                             the server refuses to start on the default pepper when bound beyond loopback.
#                             Use a long random secret, e.g. `openssl rand -hex 32`.
#
# Examples:
#   # Local dev (loopback publish, default pepper, anyone may create brains):
#     KXTA_BRAIN_ALLOW_DEFAULT_PEPPER=1 KXTA_BRAIN_ALLOW_OPEN_CREATE=1 \
#       docker compose -f docker-compose.brain.yml up -d
#
#   # Real deployment on port 80 behind TLS:
#     HOST_BIND=0.0.0.0 HOST_PORT=80 KXTA_BRAIN_PEPPER="$(openssl rand -hex 32)" \
#       KXTA_BRAIN_ENROLL_SECRET="$(openssl rand -hex 16)" \
#       docker compose -f docker-compose.brain.yml up -d

services:
  brain:
    build:
      context: .
      dockerfile: packages/brain-host/Dockerfile
    image: kontexta-brain-host:local
    container_name: kontexta-brain
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-23010}:23010"
    volumes:
      # Every brain: its full op log, current state and machines. Named volume so it survives
      # container recreation and `compose up` re-runs.
      - kontexta-brain-data:/data
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=23010
      - KXTA_BRAIN_DB=/data/kontexta-brain.db
      # Empty by default: the server warns on startup that it is using the
      # default pepper. Set this for anything beyond local experimentation.
      - KXTA_BRAIN_PEPPER=${KXTA_BRAIN_PEPPER:-}
      # Required to create a brain (dev: KXTA_BRAIN_ALLOW_OPEN_CREATE=1).
      - KXTA_BRAIN_ENROLL_SECRET=${KXTA_BRAIN_ENROLL_SECRET:-}
      - KXTA_BRAIN_ALLOW_OPEN_CREATE=${KXTA_BRAIN_ALLOW_OPEN_CREATE:-}
      - KXTA_BRAIN_ALLOW_DEFAULT_PEPPER=${KXTA_BRAIN_ALLOW_DEFAULT_PEPPER:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:23010/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kontexta-brain-data:
